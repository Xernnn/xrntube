<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="logo">🚫</span>
      <h1>XrnTube</h1>
    </header>

    <section id="current-page" class="card" hidden>
      <div class="row" id="video-row" hidden>
        <span class="label">This video</span>
        <span class="title" id="video-title"></span>
        <button class="block-btn" id="block-video-btn">Block video</button>
      </div>
      <div id="channel-rows"></div>
    </section>

    <section id="no-target" class="card muted" hidden>
      Open a YouTube video or channel page to block it directly from here.
    </section>

    <p id="page-health" class="health" hidden></p>

    <section class="stats">
      <div><strong id="channel-count">0</strong> channels blocked</div>
      <div><strong id="video-count">0</strong> videos blocked</div>
    </section>

    <div class="foot-btns">
      <button id="manage-btn" class="secondary-btn">Manage blocklist</button>
      <button id="backup-btn" class="secondary-btn" title="Back up, import, or delete">Backup &amp; import</button>
    </div>

    <script src="../shared/constants.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
