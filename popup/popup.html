<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>xrntube</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1><img class="logo" src="../icons/icon.svg" alt="xrntube" width="28" height="28" /></h1>
    </header>

    <section id="host-access" class="card" hidden>
      <p class="health warn">No access to YouTube</p>
      <button class="block-btn" id="grant-btn">Allow on YouTube</button>
    </section>

    <section id="current-page" class="card" hidden>
      <div class="row" id="video-row" hidden>
        <span class="label">This video</span>
        <span class="title" id="video-title"></span>
        <button class="block-btn" id="block-video-btn">Block video</button>
      </div>
      <div id="channel-rows"></div>
    </section>

    <section id="no-target" class="card muted" hidden>No video or channel here</section>

    <p id="page-health" class="health" hidden></p>

    <section class="stats">
      <div><strong id="channel-count">0</strong> channels blocked</div>
      <div><strong id="video-count">0</strong> videos blocked</div>
    </section>

    <div class="foot-btns">
      <button id="manage-btn" class="secondary-btn">Manage blocklist</button>
      <button id="backup-btn" class="secondary-btn">Backup &amp; import</button>
    </div>

    <script src="../shared/constants.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
